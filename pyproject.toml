# Конфигурация инструментов разработки.
# Пакет не устанавливается через pip: скрипты запускаются напрямую
# (`python scripts/.../script.py`) и не имеют внешних зависимостей.

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", "__pycache__", "samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py39"]
